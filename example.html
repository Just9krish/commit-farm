<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commit Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --panel:#1B1F26;
    --panel-alt:#232935;
    --border:#2E3540;
    --ink:#E8E6E1;
    --ink-dim:#8B929D;
    --amber:#F2A93B;
    --amber-dim:#8C6A2E;
    --red:#E8735D;
    --green:#7FB77E;
    --blue:#6E9BEF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(180deg, rgba(20,23,28,0.97), rgba(20,23,28,0.99)),
      repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(255,255,255,0.02) 24px);
    background-color:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding:18px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--amber);color:#14171C;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, .clickable:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .wrap{max-width:1040px;margin:0 auto;}

  /* header */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px;
    flex-wrap:wrap;gap:10px;
  }
  .wordmark{
    font-family:'JetBrains Mono',monospace;font-weight:800;font-size:22px;letter-spacing:0.5px;
    color:var(--ink);
  }
  .wordmark span{color:var(--amber);}
  .tagline{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .stars-badge{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--amber);
    border:1px solid var(--amber-dim);border-radius:5px;padding:6px 10px;
    background:rgba(242,169,59,0.06);
  }

  /* layout */
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;}
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:16px;
  }
  .panel h2{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--ink-dim);margin:0 0 12px 0;font-weight:600;
  }

  /* stats + click */
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .stat-label{font-size:12px;color:var(--ink-dim);}
  .stat-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--ink);}
  .stat-sub{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--green);}

  .write-btn{
    width:100%;margin-top:14px;padding:22px 10px;border-radius:8px;border:1px solid var(--amber-dim);
    background:linear-gradient(180deg, rgba(242,169,59,0.14), rgba(242,169,59,0.05));
    color:var(--amber);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;
    letter-spacing:0.5px;transition:transform 0.06s ease, background 0.15s ease;
  }
  .write-btn:hover{background:rgba(242,169,59,0.20);}
  .write-btn:active{transform:scale(0.98);}
  .write-hint{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:6px;}

  /* office visual */
  .office{
    margin-top:14px;min-height:110px;border:1px dashed var(--border);border-radius:6px;
    padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;
    background:var(--panel-alt);
  }
  .office .empty{font-size:12px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;}
  .desk{
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:14px;border-radius:3px;
    background:rgba(255,255,255,0.03);
  }

  /* prestige */
  .prestige-btn{
    width:100%;margin-top:12px;padding:12px;border-radius:6px;border:1px solid var(--red);
    background:rgba(232,115,93,0.08);color:var(--red);font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:13px;
  }
  .prestige-hint{font-size:11px;color:var(--ink-dim);margin-top:6px;line-height:1.4;}

  /* shop */
  .gen-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 8px;border-radius:6px;border:1px solid var(--border);margin-bottom:8px;
    background:var(--panel-alt);
  }
  .gen-row.affordable{border-color:var(--amber-dim);}
  .gen-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .gen-glyph{
    width:30px;height:30px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:16px;background:rgba(255,255,255,0.04);
  }
  .gen-name{font-size:13px;font-weight:600;}
  .gen-sub{font-size:11px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;}
  .buy-btn{
    flex:none;border:1px solid var(--border);background:var(--panel);color:var(--ink);
    border-radius:5px;padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:12px;
    text-align:right;min-width:78px;
  }
  .buy-btn:disabled{opacity:0.4;cursor:default;}
  .buy-btn:not(:disabled):hover{border-color:var(--amber);color:var(--amber);}
  .buy-btn .cost{display:block;font-weight:700;}
  .buy-btn .owned{display:block;color:var(--ink-dim);font-size:10px;}

  /* log */
  .log{
    font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.9;color:var(--ink-dim);
    height:150px;overflow:hidden;position:relative;
  }
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .log .new{color:var(--ink);}
  .log .hash{color:var(--blue);margin-right:6px;}

  /* achievements */
  .ach-list{display:flex;flex-wrap:wrap;gap:6px;}
  .ach{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:5px 8px;border-radius:12px;
    border:1px solid var(--border);color:var(--ink-dim);
  }
  .ach.unlocked{border-color:var(--green);color:var(--green);background:rgba(127,183,126,0.07);}

  /* event banner */
  .event-banner{
    display:none;margin-bottom:14px;padding:10px 14px;border-radius:6px;
    font-family:'JetBrains Mono',monospace;font-size:13px;border:1px solid var(--amber-dim);
    background:rgba(242,169,59,0.08);color:var(--amber);
  }
  .event-banner.show{display:block;}

  .footer-note{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-dim);}
  .footer-note button{background:none;border:none;color:var(--ink-dim);text-decoration:underline;font-size:11px;padding:0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="wordmark">COMMIT<span>_</span>FARM</div>
      <div class="tagline">grow a codebase from garage repo to IPO</div>
    </div>
    <div class="stars-badge">★ <span id="starsVal">0</span> investor stars &nbsp;·&nbsp; <span id="multVal">+0%</span> boost</div>
  </div>

  <div id="eventBanner" class="event-banner"></div>

  <div class="grid">
    <!-- LEFT: main play -->
    <div>
      <div class="panel">
        <h2>Lines of code</h2>
        <div class="stat-row">
          <div class="stat-value mono" id="locVal">0</div>
        </div>
        <div class="stat-sub" id="locRate">+0 LOC/sec</div>

        <button class="write-btn" id="writeBtn">&gt; write_code()</button>
        <div class="write-hint">click, or press space</div>

        <h2 style="margin-top:20px;">Office floor</h2>
        <div class="office" id="office"><span class="empty">// no one hired yet — the office is empty</span></div>

        <div id="prestigeBox" style="display:none;">
          <button class="prestige-btn" id="prestigeBtn">raise a funding round →</button>
          <div class="prestige-hint" id="prestigeHint"></div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px;">
        <h2>Commit log</h2>
        <div class="log" id="logBox"></div>
      </div>
    </div>

    <!-- RIGHT: shop + achievements -->
    <div>
      <div class="panel">
        <h2>Hire &amp; build</h2>
        <div id="shop"></div>
      </div>

      <div class="panel" style="margin-top:16px;">
        <h2>Achievements</h2>
        <div class="ach-list" id="achList"></div>
      </div>
    </div>
  </div>

  <div class="footer-note">autosaves locally as you play · <button id="resetBtn">reset save</button></div>
</div>

<script>
(function(){
  const SAVE_KEY = 'commit-farm-save-v1';

  const GEN_DEFS = [
    { id:'intern',  name:'Intern',            glyph:'·', color:'var(--ink-dim)', baseCost:15,      baseProd:0.1  },
    { id:'junior',  name:'Junior Dev',        glyph:'○', color:'var(--ink)',     baseCost:100,     baseProd:1    },
    { id:'senior',  name:'Senior Dev',        glyph:'◆', color:'var(--amber)',   baseCost:1100,    baseProd:8    },
    { id:'copilot', name:'AI Copilot',        glyph:'▲', color:'var(--green)',   baseCost:12000,   baseProd:47   },
    { id:'devops',  name:'DevOps Bot',        glyph:'■', color:'var(--blue)',    baseCost:130000,  baseProd:260  },
    { id:'manager', name:'Engineering Mgr',   glyph:'★', color:'var(--amber)',   baseCost:1400000, baseProd:1400 },
  ];

  const ACH_DEFS = [
    { id:'hello',   label:'Hello, World',    test:s => s.totalLoc >= 100 },
    { id:'hire1',   label:'First Hire',      test:s => s.gens.intern.owned >= 1 },
    { id:'ship',    label:'Ship It',         test:s => s.totalLoc >= 10000 },
    { id:'fullteam',label:'Full Stack Team', test:s => GEN_DEFS.every(g => s.gens[g.id].owned >= 1) },
    { id:'seriesA', label:'Series A',        test:s => s.prestigeCount >= 1 },
    { id:'unicorn', label:'Unicorn',         test:s => s.totalLoc >= 1e9 },
  ];

  const EVENTS = [
    { label:'Show HN post goes viral — production ×3',      mult:{prod:3},  dur:20 },
    { label:'Merge conflict everywhere — production ×0.7',   mult:{prod:0.7},dur:12 },
    { label:'Hackathon energy — click power ×4',             mult:{click:4}, dur:20 },
    { label:'Free espresso machine — click power ×2',        mult:{click:2}, dur:30 },
    { label:'On-call incident — production ×0.8',            mult:{prod:0.8},dur:10 },
  ];

  const COMMIT_LINES = {
    buy: [
      'fix: hired {n}, forgot onboarding docs',
      'feat: added {n} to the team',
      'chore: {n} joined, immediately opened a PR',
      'feat({n}): scaling the org, one desk at a time',
    ],
    click: [
      'fix: typo in prod (again)',
      'feat: shipped a tiny feature',
      'chore: refactored something nobody asked for',
      'fix: it works on my machine',
      'feat: added a console.log and called it debugging',
    ],
    prestige: [
      'chore!: BREAKING — reset for Series funding round',
      'feat!: closed the round, rewriting from scratch',
    ],
    event: [
      '// event: {e}',
    ],
    ach: [
      'docs: unlocked achievement — {a}',
    ],
  };

  function fmt(n){
    if (n < 1000) return n.toFixed(n < 10 ? 1 : 0);
    const units = ['K','M','B','T','Qa','Qi','Sx'];
    let u = -1;
    while (n >= 1000 && u < units.length-1){ n/=1000; u++; }
    return n.toFixed(2) + units[u];
  }

  function freshState(){
    const gens = {};
    GEN_DEFS.forEach(g => gens[g.id] = { owned:0 });
    return {
      loc:0, totalLoc:0, stars:0, prestigeCount:0,
      gens, achievements:{}, lastTs: Date.now(),
    };
  }

  let state = freshState();
  let activeEvent = null; // {def, endsAt}
  let logEntries = [];

  function costFor(def, owned){
    return Math.ceil(def.baseCost * Math.pow(1.15, owned));
  }

  function baseProdTotal(){
    let p = 0;
    GEN_DEFS.forEach(g => p += g.baseProd * state.gens[g.id].owned);
    return p;
  }

  function starMult(){ return 1 + state.stars * 0.02; }

  function eventMult(kind){
    if (activeEvent && activeEvent.def.mult[kind]) return activeEvent.def.mult[kind];
    return 1;
  }

  function currentProdRate(){
    return baseProdTotal() * starMult() * eventMult('prod');
  }

  function clickPower(){
    const internBonus = 1 + state.gens.intern.owned * 0.1;
    return 1 * internBonus * starMult() * eventMult('click');
  }

  function pushLog(category, replacements){
    const arr = COMMIT_LINES[category];
    let line = arr[Math.floor(Math.random()*arr.length)];
    if (replacements){
      Object.keys(replacements).forEach(k => { line = line.replace('{'+k+'}', replacements[k]); });
    }
    logEntries.unshift({ line, ts: Date.now() });
    if (logEntries.length > 40) logEntries.length = 40;
    renderLog();
  }

  function renderLog(){
    const box = document.getElementById('logBox');
    box.innerHTML = logEntries.slice(0,8).map((e,i) => {
      const hash = Math.random().toString(16).slice(2,9);
      return `<div class="${i===0?'new':''}"><span class="hash">${hash}</span>${e.line}</div>`;
    }).join('');
  }

  function checkAchievements(){
    ACH_DEFS.forEach(a => {
      if (!state.achievements[a.id] && a.test(state)){
        state.achievements[a.id] = true;
        pushLog('ach', { a:a.label });
      }
    });
    renderAchievements();
  }

  function renderAchievements(){
    const box = document.getElementById('achList');
    box.innerHTML = ACH_DEFS.map(a => {
      const on = !!state.achievements[a.id];
      return `<span class="ach ${on?'unlocked':''}">${on?'✓ ':'· '}${a.label}</span>`;
    }).join('');
  }

  function renderOffice(){
    const box = document.getElementById('office');
    let any = false;
    let html = '';
    GEN_DEFS.forEach(g => {
      const owned = state.gens[g.id].owned;
      if (owned > 0){
        any = true;
        const show = Math.min(owned, 60);
        for (let i=0;i<show;i++){
          html += `<div class="desk" style="color:${g.color}">${g.glyph}</div>`;
        }
        if (owned > 60){
          html += `<div class="desk mono" style="width:auto;padding:0 6px;color:${g.color}">+${owned-60}</div>`;
        }
      }
    });
    box.innerHTML = any ? html : '<span class="empty">// no one hired yet — the office is empty</span>';
  }

  function renderShop(){
    const box = document.getElementById('shop');
    box.innerHTML = GEN_DEFS.map(g => {
      const owned = state.gens[g.id].owned;
      const cost = costFor(g, owned);
      const affordable = state.loc >= cost;
      const prod = (g.baseProd * starMult()).toFixed(g.baseProd < 1 ? 2 : 1);
      return `
        <div class="gen-row ${affordable?'affordable':''}">
          <div class="gen-left">
            <div class="gen-glyph" style="color:${g.color}">${g.glyph}</div>
            <div>
              <div class="gen-name">${g.name}</div>
              <div class="gen-sub">${prod} LOC/s each · owned ${owned}</div>
            </div>
          </div>
          <button class="buy-btn" data-id="${g.id}" ${affordable?'':'disabled'}>
            <span class="cost">${fmt(cost)}</span>
            <span class="owned">buy 1</span>
          </button>
        </div>`;
    }).join('');
    box.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', () => buyGen(btn.getAttribute('data-id')));
    });
  }

  function buyGen(id){
    const def = GEN_DEFS.find(g => g.id === id);
    const owned = state.gens[id].owned;
    const cost = costFor(def, owned);
    if (state.loc < cost) return;
    state.loc -= cost;
    state.gens[id].owned += 1;
    pushLog('buy', { n: def.name });
    renderShop();
    renderOffice();
    checkAchievements();
  }

  function renderPrestige(){
    const box = document.getElementById('prestigeBox');
    const threshold = 1000000;
    if (state.totalLoc >= threshold * 0.5){
      box.style.display = 'block';
      const gain = Math.floor(Math.sqrt(state.totalLoc / threshold));
      const ready = gain >= 1;
      document.getElementById('prestigeBtn').disabled = !ready;
      document.getElementById('prestigeBtn').style.opacity = ready ? '1' : '0.45';
      document.getElementById('prestigeHint').textContent = ready
        ? `Reset current progress for +${gain} investor stars (each star = +2% production, forever).`
        : `Reach ${fmt(threshold)} lifetime LOC to unlock your first funding round. Currently ${fmt(state.totalLoc)}.`;
    } else {
      box.style.display = 'none';
    }
  }

  function doPrestige(){
    const threshold = 1000000;
    const gain = Math.floor(Math.sqrt(state.totalLoc / threshold));
    if (gain < 1) return;
    state.stars += gain;
    state.prestigeCount += 1;
    state.loc = 0;
    GEN_DEFS.forEach(g => state.gens[g.id].owned = 0);
    pushLog('prestige');
    checkAchievements();
    renderAll();
  }

  function renderTop(){
    document.getElementById('locVal').textContent = fmt(state.loc);
    document.getElementById('locRate').textContent = `+${fmt(currentProdRate())} LOC/sec`;
    document.getElementById('starsVal').textContent = state.stars;
    document.getElementById('multVal').textContent = `+${Math.round(state.stars*2)}%`;
  }

  function renderAll(){
    renderTop();
    renderShop();
    renderOffice();
    renderPrestige();
    renderAchievements();
  }

  function maybeTriggerEvent(){
    if (activeEvent) return;
    if (Math.random() < 0.006){ // roughly every ~28s on average at 200ms ticks
      const def = EVENTS[Math.floor(Math.random()*EVENTS.length)];
      activeEvent = { def, endsAt: Date.now() + def.dur*1000 };
      const banner = document.getElementById('eventBanner');
      banner.textContent = def.label + ` (${def.dur}s)`;
      banner.classList.add('show');
      pushLog('event', { e: def.label });
    }
  }

  function updateEventState(){
    if (activeEvent && Date.now() > activeEvent.endsAt){
      activeEvent = null;
      document.getElementById('eventBanner').classList.remove('show');
    }
  }

  function tick(){
    const now = Date.now();
    const dt = Math.min((now - state.lastTs) / 1000, 2);
    state.lastTs = now;
    const gain = currentProdRate() * dt;
    state.loc += gain;
    state.totalLoc += gain;
    updateEventState();
    maybeTriggerEvent();
    renderTop();
    renderShop();
    renderPrestige();
    checkAchievements();
  }

  document.getElementById('writeBtn').addEventListener('click', () => {
    const gain = clickPower();
    state.loc += gain;
    state.totalLoc += gain;
    if (Math.random() < 0.35) pushLog('click');
    renderTop();
    checkAchievements();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON'){
      e.preventDefault();
      document.getElementById('writeBtn').click();
    }
  });

  document.getElementById('prestigeBtn').addEventListener('click', doPrestige);

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (!confirm('Reset all progress? This cannot be undone.')) return;
    state = freshState();
    logEntries = [];
    activeEvent = null;
    document.getElementById('eventBanner').classList.remove('show');
    renderAll();
    renderLog();
    try { await window.storage.set(SAVE_KEY, JSON.stringify(state), false); } catch(e){}
  });

  async function save(){
    try { await window.storage.set(SAVE_KEY, JSON.stringify(state), false); }
    catch(e){ /* ignore */ }
  }

  async function load(){
    try {
      const result = await window.storage.get(SAVE_KEY, false);
      if (result && result.value){
        const loaded = JSON.parse(result.value);
        const fresh = freshState();
        state = Object.assign(fresh, loaded);
        GEN_DEFS.forEach(g => { if (!state.gens[g.id]) state.gens[g.id] = { owned:0 }; });
        state.lastTs = Date.now();
      }
    } catch(e){ /* no save yet */ }
    renderAll();
    if (logEntries.length === 0) pushLog('buy', { n:'you' });
  }

  load();
  setInterval(tick, 200);
  setInterval(save, 5000);
  window.addEventListener('beforeunload', save);

})();
</script>
</body>
</html>@
